<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuickBooks Authorization — Private Tool</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 560px; margin: 80px auto; padding: 0 20px; color: #1a1a1a; line-height: 1.6; }
  h1 { font-size: 20px; }
  p { color: #555; font-size: 14px; }
  .field { margin: 20px 0; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #888; margin-bottom: 4px; }
  .value { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: #f5f5f5; border: 1px solid #ddd; border-radius: 6px; padding: 10px 12px; word-break: break-all; }
  .error { color: #b3261e; }
  button { margin-top: 6px; font-size: 12px; padding: 4px 10px; border-radius: 5px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  button:hover { background: #f0f0f0; }
</style>
</head>
<body>
  <h1>QuickBooks Authorization Complete</h1>
  <p id="instructions">Copy the values below and paste them into your local application when it asks for them.</p>

  <div id="result"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const realmId = params.get('realmId');
    const error = params.get('error');
    const resultDiv = document.getElementById('result');

    function field(label, value) {
      const wrap = document.createElement('div');
      wrap.className = 'field';

      const l = document.createElement('label');
      l.textContent = label;

      const v = document.createElement('div');
      v.className = 'value';
      v.textContent = value;

      const btn = document.createElement('button');
      btn.textContent = 'Copy';
      btn.onclick = () => navigator.clipboard.writeText(value);

      wrap.appendChild(l);
      wrap.appendChild(v);
      wrap.appendChild(btn);
      return wrap;
    }

    if (error) {
      const p = document.createElement('p');
      p.className = 'error';
      p.textContent = 'Authorization was not completed: ' + error;
      resultDiv.appendChild(p);
    } else if (code && realmId) {
      resultDiv.appendChild(field('Authorization Code', code));
      resultDiv.appendChild(field('Realm ID (Company ID)', realmId));
    } else {
      const p = document.createElement('p');
      p.className = 'error';
      p.textContent = 'No authorization data found on this page. If you reached this page directly rather than through the QuickBooks login flow, start the connection from your local application instead.';
      resultDiv.appendChild(p);
    }
  </script>
</body>
</html>
